name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow release.yml to run this exact suite as a gating `uses:` job before it
  # publishes any binaries.
  workflow_call:

permissions:
  contents: read

concurrency:
  # Include github.workflow so a direct CI run and the `uses:`-embedded CI job of
  # release.yml land in DISTINCT groups (in a reusable workflow github.workflow
  # resolves to the CALLER), so the release caller doesn't cancel an in-flight CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The SQL test runner must speak the same VGI protocol as the community extension.
  HAYBARN_VERSION: "2.0.0rc11"

jobs:
  # bun test + own-source typecheck (shared reusable workflow).
  ci:
    uses: Query-farm/vgi-actions/.github/workflows/ts-ci.yml@main

  # SQLLogic (haybarn) E2E: test/sql/ through the published haybarn-unittest runner and
  # the signed community vgi extension, over every transport (ci/run-integration.sh, as in
  # the vgi-starter template). Bind-time schema asserts are deterministic; the
  # live-invariant asserts hit Vanguard (an egress connector — network is expected).
  e2e:
    name: SQLLogic e2e (haybarn, ${{ matrix.transport }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        transport: [stdio, launch, http]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - name: Install worker dependencies
        run: bun install --frozen-lockfile
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        env:
          WORKER: ${{ github.workspace }}/bin/vgi-etf-vanguard-worker
          HAYBARN_UNITTEST: ${{ github.workspace }}/.tools/bin/haybarn-unittest
          TRANSPORT: ${{ matrix.transport }}
        run: ci/run-integration.sh

  # Metadata-quality gate (vgi-lint): scores the worker's catalog/schema/function docs,
  # tags, categories, per-arg docs, and examples, and (execute, the action default) runs
  # them against the worker so the gate reaches assurance level L2 (behavioral), not just
  # L1 (structural). This worker is keyless, so the executed examples hit Vanguard — the
  # same egress the e2e job already relies on. fail-on info = strict.
  lint:
    name: metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install worker dependencies
        run: bun install --frozen-lockfile
      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # @v2 resolves the latest vgi-lint-check 2.x (protocol vgi.v3, haybarn 2.0).
          location: "${{ github.workspace }}/bin/vgi-etf-vanguard-worker"
          fail-on: info
          execute: "true"
